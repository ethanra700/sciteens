name: Discover Opportunity Sources

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Write results to Firestore (leave unchecked for a dry run that only logs decisions)'
        type: boolean
        default: false

concurrency:
  group: discover-opportunities
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: scrape-opportunities
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SCRAPER_SA }}

      # Scheduled runs always write. Manual runs are dry runs unless the
      # "execute" box is ticked, so the pipeline can be inspected in CI
      # logs before it is trusted to publish.
      - name: Discover new opportunity sources
        run: node scripts/discoverOpportunitySources.js --project "$GCP_PROJECT_ID" $EXECUTE_FLAG
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          EXECUTE_FLAG: ${{ (github.event_name == 'schedule' || inputs.execute == true) && '--execute' || '' }}
